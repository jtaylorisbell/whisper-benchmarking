# =============================================================================
# Compute rate catalog — the single, documented source of $/hr for cost math.
# =============================================================================
# Cost in the results table = measured inference seconds  ×  effective_usd_per_hour(compute).
# Each rate is itemized so every dollar is auditable:
#     effective_usd_per_hour = dbus_per_hour * usd_per_dbu  (+ cloud_usd_per_hour for classic)
#
# PROVENANCE (captured 2026-09-23, workspace fevm-classic-stable-h0vpq7, AWS us-east-1):
#   * usd_per_dbu  -> LIVE from system.billing.usage's price table:
#         system.billing.list_prices.pricing.effective_list  (price_end_time IS NULL)
#       Verified values (Enterprise tier, us-east-1):
#         Model Serving  (ENTERPRISE_SERVERLESS_REAL_TIME_INFERENCE_US_EAST_N_VIRGINIA) = 0.070
#         Serverless GPU (ENTERPRISE_MODEL_TRAINING_SERVERLESS_GPU_COMPUTE_PROVISIONED_CAPACITY) = 1.000
#         Serverless Jobs(ENTERPRISE_JOBS_SERVERLESS_COMPUTE_US_EAST_N_VIRGINIA) = 0.450
#       Serving & serverless-GPU $/DBU are identical across Premium/Enterprise; only the jobs rate
#       differs (Premium us-east-1 = 0.350). Re-pull anytime with cost.refresh_usd_per_dbu().
#   * dbus_per_hour -> Databricks published rates (docs.databricks.com/.../model-serving/serve-custom-llms
#       and AI Runtime pricing). Marked `verify: docs` below. These are a FIXED property of each
#       compute size, so reading/confirming them from a billing window does NOT reintroduce setup
#       skew — we still apply them only to our self-measured inference seconds. Calibrate against a
#       real tagged billing window before quoting absolute $ externally (see README "Calibrating rates").
#   * cloud_usd_per_hour -> AWS EC2 on-demand list (classic compute only).
#
# NOTE: relative comparisons across batch_size / concurrency on the SAME compute are exact
# regardless of rate precision; only cross-compute absolute $ depends on dbus_per_hour accuracy.
# -----------------------------------------------------------------------------
version: "2026-09-25.1"
source: "list_prices $/DBU (AWS us-east-1, Enterprise); AI Runtime A10 DBU/hr calibrated against system.billing.usage; serving DBU/hr still Databricks-published"

rates:
  # --- Model Serving (GPU endpoint) — billed as Serverless Real-Time Inference @ $0.07/DBU ---
  serving_gpu_medium:
    description: "Model Serving GPU_MEDIUM (1x A10)"
    databricks_sku: "ENTERPRISE_SERVERLESS_REAL_TIME_INFERENCE_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.070
    dbus_per_hour: 20.0        # verify: docs (serve-custom-llms)
  serving_gpu_large:
    description: "Model Serving GPU_LARGE (1x A100 80GB)"
    databricks_sku: "ENTERPRISE_SERVERLESS_REAL_TIME_INFERENCE_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.070
    dbus_per_hour: 78.5        # verify: docs (8x A100 = 628 DBU/hr ÷ 8)
  serving_gpu_xlarge:
    description: "Model Serving GPU_XLARGE (1x H100)"
    databricks_sku: "ENTERPRISE_SERVERLESS_REAL_TIME_INFERENCE_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.070
    dbus_per_hour: 100.0       # verify: docs

  # --- AI Runtime serverless GPU ---
  # CALIBRATED against system.billing.usage (2026-09-25): AI Runtime bills under
  # ENTERPRISE_MODEL_TRAINING_US_EAST_N_VIRGINIA (billing_origin_product=AI_RUNTIME) @ $0.65/DBU —
  # NOT the ...SERVERLESS_GPU_COMPUTE_PROVISIONED_CAPACITY SKU originally guessed. DBU/hr for 1x A10
  # measured from an isolated run: 1.128 DBUs / 0.312 provisioned-hr = ~3.6 DBU/hr -> ~$2.35/hr.
  # NOTE: custom_tags/job_id do NOT propagate to AI Runtime billing, so this was attributed by
  # isolated-workspace + time-window, not tags.
  serverless_gpu_a10:
    description: "Serverless GPU / AI Runtime, 1x A10 (GPU_1xA10)"
    databricks_sku: "ENTERPRISE_MODEL_TRAINING_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.650         # measured: list_prices effective_list (AI_RUNTIME SKU)
    dbus_per_hour: 3.6         # measured: isolated fw run (~3.6 DBU/hr); small-sample, ±~15%
  serverless_gpu_h100:
    description: "Serverless GPU / AI Runtime, 1x H100 (GPU_1xH100)"
    databricks_sku: "ENTERPRISE_MODEL_TRAINING_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.650         # same SKU as A10 (measured); H100 DBU/hr below NOT yet measured
    dbus_per_hour: 10.0        # verify: UNMEASURED (never ran H100) — placeholder, calibrate before use

  # --- Orchestration / driver job for the serving arm (issues the concurrent requests) ---
  orchestration_serverless_jobs:
    description: "Serverless Jobs compute driving serving requests (single lightweight task)"
    databricks_sku: "ENTERPRISE_JOBS_SERVERLESS_COMPUTE_US_EAST_N_VIRGINIA"
    usd_per_dbu: 0.450
    dbus_per_hour: 2.0         # verify: serverless jobs DBU/hr for a minimal driver (calibrate)
