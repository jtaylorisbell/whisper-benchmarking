[project]
name = "whisper-bench"
version = "0.2.0"
description = "Price/performance benchmarking of Whisper batch inference on Databricks AI Runtime vs Model Serving"
readme = "README.md"
authors = [
    { name = "Taylor Isbell", email = "taylor.isbell@databricks.com" }
]
# Kept broad so the built wheel installs on Databricks runtimes (DBR 15.4 LTS ML = 3.11, DBR 16.x = 3.12).
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.38",
    "jiwer>=4.0.0",
    # numpy/pandas are provided by the Databricks runtime; keep floors low to avoid forcing
    # a cluster-breaking upgrade when the wheel is installed.
    "numpy>=1.23",
    "pandas>=1.5",
    "pyarrow>=8.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "whisper-normalizer>=0.1.15",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
