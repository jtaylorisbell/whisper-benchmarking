<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa1a9"/>
    </marker>
    <marker id="arwd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b9c0c8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="678" rx="16" fill="#ffffff" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="52" font-size="26" font-weight="700" fill="#16181c">The four levers of Whisper transcription cost</text>
  <text x="36" y="88" font-size="18"><tspan fill="#5b6270">$ / audio-hour</tspan><tspan fill="#5b6270" dx="13">=</tspan><tspan fill="#3D6DB5" font-weight="700" dx="13">hourly rate</tspan><tspan fill="#5b6270" dx="13">÷</tspan><tspan fill="#3E8E37" font-weight="700" dx="13">RTFx (throughput)</tspan></text>
  <text x="36" y="113" font-size="13" fill="#6b7280">Each lever moves one side of this equation. Stack them and the same GPU drops from $0.21 to $0.05 per audio-hour.</text>

  <!-- Legend -->
  <rect x="792" y="38" width="14" height="14" rx="3" fill="#54A24B"/>
  <text x="812" y="50" font-size="12" fill="#4b5158">raises RTFx</text>
  <rect x="792" y="60" width="14" height="14" rx="3" fill="#4C78A8"/>
  <text x="812" y="72" font-size="12" fill="#4b5158">sets hourly rate</text>

  <line x1="36" y1="132" x2="964" y2="132" stroke="#eceef1" stroke-width="1"/>

  <!-- ===================== ROW 1: Compute / platform ===================== -->
  <rect x="36" y="156" width="5" height="70" rx="2" fill="#4C78A8"/>
  <text x="54" y="176" font-size="16" font-weight="700" fill="#1f2328">Compute / platform</text>
  <text x="54" y="195" font-size="11.5" fill="#7a828b">where the model runs</text>
  <rect x="54" y="205" width="74" height="20" rx="10" fill="#eaf1f9" stroke="#4C78A8" stroke-width="1"/>
  <text x="91" y="219" font-size="10.5" font-weight="700" fill="#2f5c96" text-anchor="middle">PLATFORM</text>

  <rect x="230" y="162" width="180" height="58" rx="10" fill="#f2f4f6" stroke="#d7dbe0" stroke-width="1.2"/>
  <text x="320" y="186" font-size="13.5" font-weight="600" fill="#3a3f45" text-anchor="middle">Model Serving</text>
  <text x="320" y="204" font-size="10.5" fill="#868d95" text-anchor="middle">GPU endpoint</text>

  <line x1="418" y1="191" x2="480" y2="191" stroke="#9aa1a9" stroke-width="2" marker-end="url(#arw)"/>
  <text x="449" y="180" font-size="11" font-weight="700" fill="#2f5c96" text-anchor="middle">unlocks ↓</text>

  <rect x="492" y="162" width="188" height="58" rx="10" fill="#eaf1f9" stroke="#4C78A8" stroke-width="1.4"/>
  <text x="586" y="186" font-size="13.5" font-weight="700" fill="#2f5c96" text-anchor="middle">AI Runtime</text>
  <text x="586" y="204" font-size="10.5" fill="#5a7fb0" text-anchor="middle">serverless GPU (batch)</text>

  <text x="700" y="176" font-size="12" fill="#5b626a">
    <tspan x="700" dy="0">Costs a bit more per hour — but it's</tspan>
    <tspan x="700" dy="15">the only arm where you choose the</tspan>
    <tspan x="700" dy="15">engine, model + batching below.</tspan>
    <tspan x="700" dy="15" fill="#868d95">A10 beats H100 here.</tspan>
  </text>

  <line x1="36" y1="247" x2="964" y2="247" stroke="#f0f2f4" stroke-width="1"/>

  <!-- ===================== ROW 2: Engine ===================== -->
  <rect x="36" y="263" width="5" height="70" rx="2" fill="#54A24B"/>
  <text x="54" y="283" font-size="16" font-weight="700" fill="#1f2328">Engine</text>
  <text x="54" y="302" font-size="11.5" fill="#7a828b">same weights, faster runtime</text>
  <rect x="54" y="312" width="52" height="20" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1"/>
  <text x="80" y="326" font-size="10.5" font-weight="700" fill="#3a7a33" text-anchor="middle">RTFx</text>

  <rect x="230" y="269" width="180" height="58" rx="10" fill="#f2f4f6" stroke="#d7dbe0" stroke-width="1.2"/>
  <text x="320" y="293" font-size="13.5" font-weight="600" fill="#3a3f45" text-anchor="middle">HF pipeline</text>
  <text x="320" y="311" font-size="10.5" fill="#868d95" text-anchor="middle">transformers</text>

  <line x1="418" y1="298" x2="480" y2="298" stroke="#9aa1a9" stroke-width="2" marker-end="url(#arw)"/>
  <text x="449" y="287" font-size="11" font-weight="700" fill="#3a7a33" text-anchor="middle">≈1.5× RTFx</text>

  <rect x="492" y="269" width="188" height="58" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1.4"/>
  <text x="586" y="293" font-size="13.5" font-weight="700" fill="#3a7a33" text-anchor="middle">faster-whisper</text>
  <text x="586" y="311" font-size="10.5" fill="#4b7a44" text-anchor="middle">CTranslate2</text>

  <text x="700" y="283" font-size="12" fill="#5b626a">
    <tspan x="700" dy="0">Leaner C++ engine with int8 / fp16</tspan>
    <tspan x="700" dy="15">quantization. Identical large-v3</tspan>
    <tspan x="700" dy="15">weights — so accuracy is unchanged.</tspan>
  </text>

  <line x1="36" y1="354" x2="964" y2="354" stroke="#f0f2f4" stroke-width="1"/>

  <!-- ===================== ROW 3: Model ===================== -->
  <rect x="36" y="370" width="5" height="70" rx="2" fill="#54A24B"/>
  <text x="54" y="390" font-size="16" font-weight="700" fill="#1f2328">Model</text>
  <text x="54" y="409" font-size="11.5" fill="#7a828b">accuracy vs speed</text>
  <rect x="54" y="419" width="52" height="20" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1"/>
  <text x="80" y="433" font-size="10.5" font-weight="700" fill="#3a7a33" text-anchor="middle">RTFx</text>

  <rect x="230" y="376" width="180" height="58" rx="10" fill="#f2f4f6" stroke="#d7dbe0" stroke-width="1.2"/>
  <text x="320" y="400" font-size="13.5" font-weight="600" fill="#3a3f45" text-anchor="middle">large-v3</text>
  <text x="320" y="418" font-size="10.5" fill="#868d95" text-anchor="middle">full · 32-layer decoder</text>

  <line x1="418" y1="405" x2="480" y2="405" stroke="#9aa1a9" stroke-width="2" marker-end="url(#arw)"/>
  <text x="449" y="394" font-size="11" font-weight="700" fill="#3a7a33" text-anchor="middle">≈2× RTFx</text>

  <rect x="492" y="376" width="188" height="58" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1.4"/>
  <text x="586" y="400" font-size="13.5" font-weight="700" fill="#3a7a33" text-anchor="middle">large-v3-turbo</text>
  <text x="586" y="418" font-size="10.5" fill="#4b7a44" text-anchor="middle">distilled · 4-layer decoder</text>

  <text x="700" y="390" font-size="12" fill="#5b626a">
    <tspan x="700" dy="0">Much smaller decoder. ≈ same WER</tspan>
    <tspan x="700" dy="15">on clean English — the single biggest</tspan>
    <tspan x="700" dy="15">cost drop in the whole stack.</tspan>
  </text>

  <line x1="36" y1="461" x2="964" y2="461" stroke="#f0f2f4" stroke-width="1"/>

  <!-- ===================== ROW 4: Windowing ===================== -->
  <rect x="36" y="477" width="5" height="76" rx="2" fill="#54A24B"/>
  <text x="54" y="497" font-size="16" font-weight="700" fill="#1f2328">Windowing</text>
  <text x="54" y="516" font-size="11.5" fill="#7a828b">how 30 s windows fill</text>
  <rect x="54" y="526" width="52" height="20" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1"/>
  <text x="80" y="540" font-size="10.5" font-weight="700" fill="#3a7a33" text-anchor="middle">RTFx</text>

  <rect x="230" y="483" width="180" height="58" rx="10" fill="#f2f4f6" stroke="#d7dbe0" stroke-width="1.2"/>
  <text x="320" y="507" font-size="13.5" font-weight="600" fill="#3a3f45" text-anchor="middle">Non-packed</text>
  <text x="320" y="525" font-size="10.5" fill="#868d95" text-anchor="middle">pad each clip to 30 s</text>

  <line x1="418" y1="512" x2="480" y2="512" stroke="#b9c0c8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arwd)"/>
  <text x="449" y="501" font-size="11" font-weight="700" fill="#4b7a44" text-anchor="middle">≈3× RTFx*</text>

  <rect x="492" y="483" width="188" height="58" rx="10" fill="#f4f9f2" stroke="#54A24B" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="586" y="507" font-size="13.5" font-weight="700" fill="#3a7a33" text-anchor="middle">Packed</text>
  <text x="586" y="525" font-size="10.5" fill="#4b7a44" text-anchor="middle">fill 30 s windows</text>

  <text x="700" y="497" font-size="12" fill="#5b626a">
    <tspan x="700" dy="0">Reclaims the ~75% of each encode</tspan>
    <tspan x="700" dy="15">wasted padding short clips. A real long</tspan>
    <tspan x="700" dy="15">call fills its windows for free.</tspan>
    <tspan x="700" dy="15" fill="#868d95">*long-form proxy, not a committed row.</tspan>
  </text>

  <line x1="36" y1="574" x2="964" y2="574" stroke="#eceef1" stroke-width="1"/>

  <!-- ===================== Footer: net cost ladder ===================== -->
  <text x="36" y="612" font-size="13" font-weight="700" fill="#1f2328">Net, on one A10:</text>

  <rect x="176" y="592" width="120" height="40" rx="10" fill="#fdeceb" stroke="#E45756" stroke-width="1.3"/>
  <text x="236" y="609" font-size="14" font-weight="700" fill="#b23b3a" text-anchor="middle">$0.21</text>
  <text x="236" y="624" font-size="10" fill="#9c5b59" text-anchor="middle">serving</text>

  <line x1="302" y1="612" x2="340" y2="612" stroke="#9aa1a9" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="346" y="592" width="252" height="40" rx="10" fill="#eaf4e8" stroke="#54A24B" stroke-width="1.3"/>
  <text x="472" y="609" font-size="14" font-weight="700" fill="#3a7a33" text-anchor="middle">$0.054</text>
  <text x="472" y="624" font-size="10" fill="#4b7a44" text-anchor="middle">AI Runtime + faster-whisper + turbo</text>

  <line x1="604" y1="612" x2="642" y2="612" stroke="#b9c0c8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arwd)"/>

  <rect x="648" y="592" width="316" height="40" rx="10" fill="#f5f7f9" stroke="#b9c0c8" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="668" y="609" font-size="14" font-weight="700" fill="#5b626a">$0.018</text>
  <text x="668" y="624" font-size="10" fill="#868d95">+ filled 30 s windows · long-form proxy</text>

  <text x="36" y="654" font-size="10.5" fill="#98a0a8">solid = committed benchmark rows   ·   dashed = long-form projection (fills windows the way a real call does)</text>
</svg>
